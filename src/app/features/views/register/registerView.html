<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
    <link rel="stylesheet" href="registerStyle.scss">

</head>
<app-header></app-header>

<body>
    <div class="card">
        <h1>Registrarse</h1>
        <form action="" method="post">
            <div>
                <label for="name">Nombre: </label>
                <input type="text" name="name" id="name" required maxlength="64" minlength="6">
            </div>
            <div>
                <label for="surname">Apellido: </label>
                <input type="text" name="surname" id="surname" required minlength="6" maxlength="64">
            </div>
            <div>
                <label for="email">Correo: </label>
                <input type="email" name="email" id="email" required maxlength="64" minlength="6">
            </div>
            <div>
                <label for="password">Contraseña: </label>
                <input type="password" name="password" id="password" required maxlength="64" minlength="8">
            </div>
            <div>
                <label for="age">Edad: </label>
                <input type="number" name="age" id="age" required min="0" max="120">
            </div>
            <div>
                <button type="submit">Registrarse</button>
                <a href="**/loginView.html">Volver a Iniciar Sesión</a>
            </div>

        </form>
    </div>
</body>
</html>
