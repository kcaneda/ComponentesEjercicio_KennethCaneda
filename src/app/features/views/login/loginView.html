<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="loginStyle.scss">
</head>
<body>
    <div>
        <h1>Iniciar Sesión</h1>
        <form action="" method="post">
            <div>
                <label for="email">Correo: </label>
                <input type="email" name="email" id="email" required placeholder="Ingrese su correo." minlength="6" maxlength="64">
            </div>
            <div>
                <label for="password">Contraseña: </label>
                <input type="password" name="password" id="password" required placeholder="Ingrese su contraseña." minlength="8" maxlength="64">
            </div>
            <button type="submit">Iniciar Sesión</button>
            <a href="**/RegisterView.html">¿No tienes cuenta? Registrate.</a>
        </form>
    </div>
</body>
</html>
